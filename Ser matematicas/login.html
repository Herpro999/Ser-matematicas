<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Iniciar sesión | HealthTrack</title>

    <link rel="stylesheet" href="Style.css" />
  </head>

  <body class="login-page">

    <main class="login-card">

      <img
  src="Images/doctor log in.jpg"
  class="hero-image"
  alt="HealthTrack"
>
      <h1>HealthTrack</h1>

      <h2>Iniciar sesión</h2>

      <p class="login-subtitle">
        Ingresa a tu cuenta para continuar cuidando tu salud.
      </p>

      <form id="loginForm">

        <div class="input-group">
          <label for="loginEmail">
            Correo electrónico
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="correo@ejemplo.com"
            required
          />
        </div>

        <div class="input-group">
          <label for="loginPassword">
            Contraseña
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Tu contraseña"
            required
          />
        </div>

        <button
          type="submit"
          class="primary-btn"
        >
          Iniciar sesión
        </button>

      </form>

      <p id="mensajeLogin"></p>

      <p class="auth-link">
        ¿No tienes una cuenta?

        <a href="singup.html">
          Registrarte
        </a>
      </p>

    </main>

    <script
      type="module"
      src="auth.js"
    ></script>

  </body>
</html>
